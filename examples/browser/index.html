<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenUI Lang phase 0</title>
    <style>
      body {
        margin: 24px;
        max-width: 960px;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: #1f2328;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        font: 13px/1.45 ui-monospace, monospace;
      }
      button {
        font: inherit;
        padding: 6px 14px;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
      }
      .stat {
        background: #f6f8fa;
        border-radius: 8px;
        padding: 8px 12px;
      }
      pre {
        background: #f6f8fa;
        padding: 12px;
        overflow: auto;
        max-height: 480px;
      }
      .error {
        color: #cf222e;
      }
    </style>
  </head>
  <body>
    <h1>OpenUI Lang phase 0</h1>
    <p>MoonBit lexer 和语句解析，编译为 Wasm-GC。这一步不做 Schema 校验和流式状态机。</p>
    <textarea id="source" spellcheck="false"></textarea>
    <p><button id="run" type="button">Parse</button></p>
    <div class="stats" id="stats"></div>
    <p id="status"></p>
    <h2>JSON</h2>
    <pre id="json"></pre>
    <script type="module">
      const source = document.querySelector("#source");
      const stats = document.querySelector("#stats");
      const status = document.querySelector("#status");
      const json = document.querySelector("#json");

      const median = (values) => {
        const sorted = [...values].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 === 0
          ? (sorted[mid - 1] + sorted[mid]) / 2
          : sorted[mid];
      };

      const wasmResponse = await fetch("./parser.wasm");
      const wasmBytes = new Uint8Array(await wasmResponse.arrayBuffer());
      const gzipStream = new Blob([wasmBytes])
        .stream()
        .pipeThrough(new CompressionStream("gzip"));
      const gzipBytes = (await new Response(gzipStream).arrayBuffer()).byteLength;
      const { instance } = await WebAssembly.instantiate(wasmBytes, {}, {
        builtins: ["js-string"],
        importedStringConstants: "_",
      });
      const { parse_openui } = instance.exports;
      source.value = await (await fetch("../signup.openui")).text();

      const parseNow = () => {
        const text = source.value;
        for (let i = 0; i < 10; i++) parse_openui(text);
        const samples = [];
        let rendered = "";
        for (let i = 0; i < 100; i++) {
          const start = performance.now();
          rendered = parse_openui(text);
          samples.push(performance.now() - start);
        }
        const result = JSON.parse(rendered);
        json.textContent = rendered;
        const medianMs = median(samples);
        stats.replaceChildren(
          stat("语句", String(result.statements.length)),
          stat("错误", String(result.errors.length)),
          stat("中位耗时", `${medianMs.toFixed(3)} ms`),
          stat("Wasm", `${wasmBytes.byteLength} B`),
          stat("gzip", `${gzipBytes} B`),
        );
        status.className = result.errors.length === 0 ? "" : "error";
        status.textContent =
          result.errors.length === 0
            ? `解析完成，入口是 ${result.statements[0]?.id ?? "无"}。`
            : result.errors.map((err) => `${err.line}:${err.column} ${err.message}`).join("\n");
      };

      const stat = (label, value) => {
        const node = document.createElement("div");
        node.className = "stat";
        node.textContent = `${label} ${value}`;
        return node;
      };

      document.querySelector("#run").addEventListener("click", parseNow);
      parseNow();
    </script>
  </body>
</html>
