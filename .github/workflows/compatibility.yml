name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Official OpenUI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup MoonBit
        uses: cogna-dev/moonbit-actions/setup@v0
        with:
          version: latest

      - name: Build Wasm package
        run: |
          moon build --target wasm-gc --release
          node npm/build.mjs

      - name: Clone OpenUI
        run: git clone --depth 1 https://github.com/thesysdev/openui.git upstream

      - name: Install OpenUI
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Add MoonBit parser
        working-directory: upstream
        run: pnpm --filter @openuidev/lang-core add "@heyq02/openui.mbt@file:${GITHUB_WORKSPACE}/npm"

      - name: Patch parser source
        run: node npm/cli.js patch-source upstream

      - name: Rebuild lang-core
        working-directory: upstream/packages/lang-core
        run: pnpm run build

      - name: Test parser
        continue-on-error: true
        working-directory: upstream/packages/lang-core
        run: |
          set -o pipefail
          pnpm exec vitest run src/parser/__tests__ 2>&1 | tee "$GITHUB_WORKSPACE/compatibility-parser.log"

      - name: Test lang-core
        continue-on-error: true
        working-directory: upstream/packages/lang-core
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$GITHUB_WORKSPACE/compatibility-lang-core.log"

      - name: Test workspace
        continue-on-error: true
        working-directory: upstream
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$GITHUB_WORKSPACE/compatibility-workspace.log"

      - name: Write compatibility result
        id: report
        if: always()
        run: |
          node scripts/compatibility-report.mjs \
            --package upstream/packages/lang-core/package.json \
            --out docs/compatibility.json \
            --stage parser=compatibility-parser.log \
            --stage lang-core=compatibility-lang-core.log \
            --stage workspace=compatibility-workspace.log

      - name: Publish compatibility badge
        if: always() && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/compatibility-report.mjs --publish docs/compatibility.json

      - name: Check compatibility
        if: always() && steps.report.outcome == 'success'
        run: node scripts/compatibility-report.mjs --check docs/compatibility.json
