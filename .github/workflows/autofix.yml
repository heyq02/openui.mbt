name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm i -fg corepack && corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install
      - run: pnpm run format
      - name: Setup MoonBit
        uses: cogna-dev/moonbit-actions/setup@v0
      - name: moon fmt
        run: moon fmt
      - name: moon check
        run: |
          set -euo pipefail
          moon check --deny-warn --fmt --target native
          moon check --deny-warn --fmt --target wasm-gc
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          commit-message: "chore: apply automated updates"
